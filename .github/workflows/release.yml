# Publishes a Street Kit release whenever main gets a new version in CHANGELOG.md.
# Releasing = merging a PR whose CHANGELOG.md has a new "## [x.y.z]" heading at the top.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md || true)
          if [ -z "$VERSION" ]; then
            echo "No version heading in CHANGELOG.md; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build street-kit.zip
        if: steps.version.outputs.skip == 'false'
        run: |
          mkdir -p dist/pkg
          cp -r art fonts manifest.json README.md CHANGELOG.md dist/pkg/
          find dist/pkg -name .gitkeep -delete
          echo "v${{ steps.version.outputs.version }}" > dist/pkg/VERSION
          (cd dist/pkg && zip -qr ../street-kit.zip .)
          # Release notes: the top CHANGELOG section.
          awk '/^## \[/{n++} n==1 && !/^## \[/' CHANGELOG.md > dist/notes.md

      - name: Publish release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/street-kit.zip \
            --target "$GITHUB_SHA" \
            --title "Street Kit v${{ steps.version.outputs.version }}" \
            --notes-file dist/notes.md
